services:
  visionctx:
    build: .
    environment:
      VISIONCTX_IN_CONTAINER: "1"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      - visionctx-data:/app/data
    restart: unless-stopped
volumes:
  visionctx-data:
